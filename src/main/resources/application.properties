# SITRA — configuración. Los valores sensibles llegan por variables de entorno (ver .env.example).
spring.application.name=sitra
server.port=${SITRA_PORT:8080}

# Base de datos MariaDB (XAMPP). En el laboratorio: root sin contraseña.
spring.datasource.url=${SITRA_DB_URL:jdbc:mariadb://localhost:3306/sitra}
spring.datasource.username=${SITRA_DB_USER:root}
spring.datasource.password=${SITRA_DB_PASSWORD:}

# El esquema lo controlan los scripts de db/migrations (triggers incluidos): Hibernate no crea tablas.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Conector del núcleo: simulado | sin-respuesta | legado (ADR-001)
sitra.nucleo.modo=${SITRA_NUCLEO_MODO:simulado}

# Token JWT (ADR-005). Si SITRA_JWT_SECRET no existe, se genera un secreto aleatorio al arrancar.
sitra.jwt.secreto=${SITRA_JWT_SECRET:}
sitra.jwt.minutos=${SITRA_JWT_MINUTOS:30}
